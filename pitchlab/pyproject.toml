[project]
name = "pitchlab"
version = "0.1.0"
description = "A reproducible Statcast pipeline and analysis workbench."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pybaseball>=2.2.7",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchlab"]

# --- Ruff: linter and formatter in one tool. ------------------------------
[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: real bugs, undefined names
    "I",   # import sorting
    "UP",  # prefer modern Python idioms
    "B",   # bugbear: likely mistakes
    "SIM", # simplifiable code
    "PTH", # use pathlib instead of os.path
    "RUF", # ruff's own checks
]

# --- Mypy: the Python equivalent of the strict tsconfig. ------------------
# Same philosophy as the TypeScript side: make the computer catch it.
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# These ship no type information (or none mypy can find). Silencing the
# import is not the same as silencing type checking of our own code.
[[tool.mypy.overrides]]
module = ["pybaseball.*", "duckdb.*", "pytest.*", "_pytest.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Find the package from source even if the editable install is skipped
# (macOS can hide the .pth file that editable installs rely on).
pythonpath = ["src"]
addopts = "-q"
